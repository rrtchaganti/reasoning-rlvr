# EXP-005 / checkpoint selection: greedy think-tag accuracy on the dev split (250 GSM8K-train +
# 250 MATH-train, fixed seed). Pass the checkpoint and output dir on the command line:
#   rlvr-eval --config configs/eval/ckpt_think_tag_dev.yaml --model outputs/train/X/final --out outputs/eval/X_dev
evals: [gsm8k_dev, math_dev]
template: think_tag
n: 1
temperature: 0.0
max_tokens: 4096
seed: 0
backend: vllm
batch_invariant: true
dtype: bfloat16
gpu_memory_utilization: 0.90
max_model_len: 6144
