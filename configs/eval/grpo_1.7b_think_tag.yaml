# EXP-012: GRPO checkpoint, same protocol as EXP-006 and EXP-010 (paired with the RFT and SFT rows on the full sets).
model: outputs/train/grpo_1p7b/final
evals: [gsm8k, gsm8k_perturbed, math500, countdown, aime24]
template: think_tag
n: 1
temperature: 0.0
max_tokens: 4096
seed: 0
countdown_n: 500
backend: vllm
batch_invariant: true
dtype: bfloat16
gpu_memory_utilization: 0.85
# 4096 on purpose: the budget is the window minus the prompt (3,865-3,994 new tokens); every paired
# think-tag row (base reference and checkpoints) uses the same window. rlvr-eval prints the effective
# budget per eval and records it as context_budget in metrics.json (journal, section 14).
max_model_len: 4096
out: outputs/eval/grpo_1.7b_think_tag
