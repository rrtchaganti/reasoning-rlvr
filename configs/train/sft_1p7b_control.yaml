# EXP-010b: the compute-matched control for RFT (PLAN.md section 4.4). One more epoch from the
# SFT checkpoint on a fresh seeded slice of the OpenR1 set with as many examples as the RFT kept set
# (the session script passes --set limit=<kept examples>), same LR and schedule as the RFT run.
# Answers "is RFT's gain just more training?".
model: outputs/train/sft_1p7b/final
data: outputs/data/sft/train.jsonl
manifest: data/manifests/sft_openr1.json
subset_fraction: 1.0
subset_seed: 1
limit: 10000
max_length: 4096
epochs: 1
learning_rate: 5.0e-6
lr_scheduler: cosine_with_min_lr
min_lr_rate: 0.1
warmup_ratio: 0.03
weight_decay: 0.1
adam_beta1: 0.9
adam_beta2: 0.95
max_grad_norm: 1.0
per_device_batch: 4
grad_accum: 16
packing: true
attn_implementation: flash_attention_2
gradient_checkpointing: true
bf16: true
load_dtype: float32
save_steps: 250
save_total_limit: 2
logging_steps: 10
seed: 0
report_to: wandb
run_name: sft_1p7b_control
out: outputs/train/sft_1p7b_control
