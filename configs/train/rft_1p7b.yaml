# EXP-010: one iteration of rejection-sampling fine-tuning from the SFT checkpoint on the kept
# set built by rlvr-build-rft (manifest hash checked). LR 5e-6 cosine, 1 epoch, effective batch 64,
# fp32 master weights under bf16 autocast, as in PHASES_IO_AND_HYPERPARAMS.md. On E2E add
# --set packing=false (no flash-attn there).
model: outputs/train/sft_1p7b/final
data: outputs/data/rft/train.jsonl
manifest: outputs/data/rft/manifest.json
subset_fraction: 1.0
subset_seed: 0
max_length: 4096
epochs: 1
learning_rate: 5.0e-6
lr_scheduler: cosine_with_min_lr
min_lr_rate: 0.1
warmup_ratio: 0.03
weight_decay: 0.1
adam_beta1: 0.9
adam_beta2: 0.95
max_grad_norm: 1.0
per_device_batch: 4
grad_accum: 16
packing: true
attn_implementation: flash_attention_2
gradient_checkpointing: true
bf16: true
load_dtype: float32
save_steps: 250
save_total_limit: 2
logging_steps: 10
seed: 0
report_to: wandb
run_name: rft_1p7b
out: outputs/train/rft_1p7b
