# EXP-007: LoRA r = 64 (alpha 128, dropout 0.05, all linear layers, LR 2e-4) at the same data and
# epochs as the full fine-tune; adapter merged into the base weights at the end for vLLM.
model: Qwen/Qwen3-1.7B-Base
data: outputs/data/sft/train.jsonl
manifest: data/manifests/sft_openr1.json
subset_fraction: 1.0
subset_seed: 0
max_length: 4096
epochs: 2
learning_rate: 2.0e-4
lr_scheduler: cosine_with_min_lr
min_lr_rate: 0.1
warmup_ratio: 0.03
weight_decay: 0.1
adam_beta1: 0.9
adam_beta2: 0.95
max_grad_norm: 1.0
per_device_batch: 4
grad_accum: 16
packing: true
attn_implementation: flash_attention_2
gradient_checkpointing: true
bf16: true
load_dtype: bfloat16  # frozen base in bf16; LoRA adapters and the tag rows train in fp32
lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: all-linear
  merge: true
save_steps: 500
save_total_limit: 2
logging_steps: 10
seed: 0
report_to: wandb
run_name: sft_1p7b_lora
out: outputs/train/sft_1p7b_lora
